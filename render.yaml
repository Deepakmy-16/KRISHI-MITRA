services:
  - type: web
    name: krishi-mitra-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATA_GOV_API_KEY
        sync: false   # Set manually in Render dashboard
      - key: CHATBOT_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: REACT_APP_CLERK_PUBLISHABLE_KEY
        sync: false
    disk:
      name: crop-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
